<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="100%" height="100%">
  <defs>
    <!-- 背景网格图案 -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.5"/>
    </pattern>
    
    <!-- 卡片阴影滤镜 -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- 标题渐变 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- 阶段标签渐变 -->
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- 痛点区域渐变 -->
    <linearGradient id="painGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <!-- 解决方案区域渐变 -->
    <linearGradient id="solutionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="960" fill="#0B1121"/>
  <rect width="1200" height="960" fill="url(#grid)"/>

  <!-- 顶部标题区域 -->
  <rect x="250" y="24" width="700" height="52" rx="26" fill="url(#titleGrad)" stroke="#3B82F6" stroke-width="2" filter="url(#glow)"/>
  <text x="600" y="56" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="bold" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">AI 落地核心挑战与解决方案全景图</text>
  <rect x="300" y="84" width="600" height="4" rx="2" fill="url(#titleGrad)" filter="url(#glow)"/>
  <text x="600" y="110" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#94A3B8" text-anchor="middle" letter-spacing="1">基于企业级 AI Infra 的全链路优化方案</text>

  <!-- 图例 -->
  <rect x="870" y="86" width="300" height="36" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="890" cy="104" r="6" fill="#EF4444"/>
  <text x="905" y="109" font-family="Arial, sans-serif" font-size="14" fill="#CBD5E1">痛点与现状</text>
  <circle cx="980" cy="104" r="6" fill="#10B981"/>
  <text x="995" y="109" font-family="Arial, sans-serif" font-size="14" fill="#CBD5E1">解决方案</text>

  <!-- ================= 行 1：数据工程 ================= -->
  <g transform="translate(0, 140)">
    <!-- 行背景 -->
    <rect x="30" y="0" width="1140" height="110" rx="10" fill="#1E293B" filter="url(#shadow)"/>
    
    <!-- 阶段标签 -->
    <rect x="30" y="0" width="160" height="110" rx="10" fill="url(#stageGrad)"/>
    <rect x="180" y="0" width="10" height="110" fill="url(#stageGrad)"/>
    <text x="110" y="62" font-family="'PingFang SC', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. 数据工程</text>
    
    <!-- 痛点区域 -->
    <rect x="200" y="0" width="430" height="110" rx="0" fill="url(#painGrad)"/>
    <text x="220" y="40" font-family="'PingFang SC', sans-serif" font-size="19" font-weight="bold" fill="#F87171">痛点：数据获取困难</text>
    <text x="220" y="70" font-family="'PingFang SC', sans-serif" font-size="17" fill="#FCA5A5">现状：高质量 SFT 数据成本高，难以沉淀</text>
    
    <!-- 箭头 1 -->
    <polygon points="635,-5 645,5 635,15" fill="#3B82F6"/>
    <text x="640" y="55" font-size="20" fill="#3B82F6" text-anchor="middle">→</text>
    
    <!-- 解决方案区域 -->
    <rect x="650" y="0" width="520" height="110" rx="0" fill="url(#solutionGrad)"/>
    <rect x="650" y="0" width="520" height="110" rx="10"/>
    <text x="670" y="40" font-family="'PingFang SC', sans-serif" font-size="19" font-weight="bold" fill="#4ADE80">解决方案：</text>
    <text x="670" y="70" font-family="'PingFang SC', sans-serif" font-size="17" fill="#6EE7B7">API 透明代理 + 数据飞轮，自动沉淀高质量训练数据</text>
  </g>

  <!-- 向下箭头 -->
  <polygon points="110,255 120,275 115,275 115,285 105,285 105,275 100,275" fill="#475569"/>

  <!-- ================= 行 2：模型训练 ================= -->
  <g transform="translate(0, 290)">
    <rect x="30" y="0" width="1140" height="110" rx="10" fill="#1E293B" filter="url(#shadow)"/>
    
    <rect x="30" y="0" width="160" height="110" rx="10" fill="url(#stageGrad)"/>
    <rect x="180" y="0" width="10" height="110" fill="url(#stageGrad)"/>
    <text x="110" y="62" font-family="'PingFang SC', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. 模型训练</text>
    
    <rect x="200" y="0" width="430" height="110" rx="0" fill="url(#painGrad)"/>
    <text x="220" y="40" font-family="'PingFang SC', sans-serif" font-size="19" font-weight="bold" fill="#F87171">痛点：训练成本高</text>
    <text x="220" y="70" font-family="'PingFang SC', sans-serif" font-size="17" fill="#FCA5A5">现状：从零训练大模型需要大量 GPU 资源</text>
    
    <polygon points="635,-5 645,5 635,15" fill="#3B82F6"/>
    <text x="640" y="55" font-size="20" fill="#3B82F6" text-anchor="middle">→</text>
    
    <rect x="650" y="0" width="520" height="110" rx="10" fill="url(#solutionGrad)"/>
    <text x="670" y="40" font-family="'PingFang SC', sans-serif" font-size="19" font-weight="bold" fill="#4ADE80">解决方案：</text>
    <text x="670" y="70" font-family="'PingFang SC', sans-serif" font-size="17" fill="#6EE7B7">知识蒸馏 + LoRA 微调，显著降低训练成本</text>
  </g>

  <!-- 向下箭头 -->
  <polygon points="110,405 120,425 115,425 115,435 105,435 105,425 100,425" fill="#475569"/>

  <!-- ================= 行 3：模型压缩与推理 ================= -->
  <g transform="translate(0, 440)">
    <rect x="30" y="0" width="1140" height="120" rx="10" fill="#1E293B" filter="url(#shadow)"/>
    
    <rect x="30" y="0" width="160" height="120" rx="10" fill="url(#stageGrad)"/>
    <rect x="180" y="0" width="10" height="120" fill="url(#stageGrad)"/>
    <text x="110" y="65" font-family="'PingFang SC', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. 模型压缩与推理</text>
    
    <rect x="200" y="0" width="430" height="120" rx="0" fill="url(#painGrad)"/>
    <text x="220" y="35" font-family="'PingFang SC', sans-serif" font-size="19" font-weight="bold" fill="#F87171">痛点：推理成本高 / 速度慢 / 部署门槛高</text>
    <text x="220" y="65" font-family="'PingFang SC', sans-serif" font-size="17" fill="#FCA5A5">现状：70B+ 模型依赖多卡集群</text>
    <text x="220" y="90" font-family="'PingFang SC', sans-serif" font-size="17" fill="#FCA5A5">生成仅 20~50 Tokens/s，模型体积数百 GB</text>
    
    <polygon points="635,-5 645,5 635,15" fill="#3B82F6"/>
    <text x="640" y="60" font-size="20" fill="#3B82F6" text-anchor="middle">→</text>
    
    <rect x="650" y="0" width="520" height="120" rx="10" fill="url(#solutionGrad)"/>
    <text x="670" y="35" font-family="'PingFang SC', sans-serif" font-size="19" font-weight="bold" fill="#4ADE80">解决方案：</text>
    <text x="670" y="65" font-family="'PingFang SC', sans-serif" font-size="17" fill="#6EE7B7">蒸馏至 0.5B~7B 模型 + INT4/AWQ/GPTQ 量化</text>
    <text x="670" y="90" font-family="'PingFang SC', sans-serif" font-size="17" fill="#6EE7B7">vLLM + KV Cache 优化，成本↓80%，速度 150~500 Tokens/s，单卡部署</text>
  </g>

  <!-- 向下箭头 -->
  <polygon points="110,565 120,585 115,585 115,595 105,595 105,585 100,585" fill="#475569"/>

  <!-- ================= 行 4：领域知识与 RAG ================= -->
  <g transform="translate(0, 600)">
    <rect x="30" y="0" width="1140" height="110" rx="10" fill="#1E293B" filter="url(#shadow)"/>
    
    <rect x="30" y="0" width="160" height="110" rx="10" fill="url(#stageGrad)"/>
    <rect x="180" y="0" width="10" height="110" fill="url(#stageGrad)"/>
    <text x="110" y="62" font-family="'PingFang SC', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4. 领域知识与 RAG</text>
    
    <rect x="200" y="0" width="430" height="110" rx="0" fill="url(#painGrad)"/>
    <text x="220" y="40" font-family="'PingFang SC', sans-serif" font-size="19" font-weight="bold" fill="#F87171">痛点：领域知识缺失</text>
    <text x="220" y="70" font-family="'PingFang SC', sans-serif" font-size="17" fill="#FCA5A5">现状：通用模型无法理解企业内部知识</text>
    
    <polygon points="635,-5 645,5 635,15" fill="#3B82F6"/>
    <text x="640" y="55" font-size="20" fill="#3B82F6" text-anchor="middle">→</text>
    
    <rect x="650" y="0" width="520" height="110" rx="10" fill="url(#solutionGrad)"/>
    <text x="670" y="40" font-family="'PingFang SC', sans-serif" font-size="19" font-weight="bold" fill="#4ADE80">解决方案：</text>
    <text x="670" y="70" font-family="'PingFang SC', sans-serif" font-size="17" fill="#6EE7B7">RAG + 专业数据集微调，构建领域专家模型</text>
  </g>

  <!-- 向下箭头 -->
  <polygon points="110,715 120,735 115,735 115,745 105,745 105,735 100,735" fill="#475569"/>

  <!-- ================= 行 5：Agent 与工程链路 ================= -->
  <g transform="translate(0, 750)">
    <rect x="30" y="0" width="1140" height="120" rx="10" fill="#1E293B" filter="url(#shadow)"/>
    
    <rect x="30" y="0" width="160" height="120" rx="10" fill="url(#stageGrad)"/>
    <rect x="180" y="0" width="10" height="120" fill="url(#stageGrad)"/>
    <text x="110" y="65" font-family="'PingFang SC', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5. Agent 与工程链路</text>
    
    <rect x="200" y="0" width="430" height="120" rx="0" fill="url(#painGrad)"/>
    <text x="220" y="35" font-family="'PingFang SC', sans-serif" font-size="19" font-weight="bold" fill="#F87171">痛点：Agent 效果不稳定 / 工程链路割裂</text>
    <text x="220" y="65" font-family="'PingFang SC', sans-serif" font-size="17" fill="#FCA5A5">现状：Tool Calling 容易失败</text>
    <text x="220" y="90" font-family="'PingFang SC', sans-serif" font-size="17" fill="#FCA5A5">训练、推理、Agent 系统分散</text>
    
    <polygon points="635,-5 645,5 635,15" fill="#3B82F6"/>
    <text x="640" y="60" font-size="20" fill="#3B82F6" text-anchor="middle">→</text>
    
    <rect x="650" y="0" width="520" height="120" rx="10" fill="url(#solutionGrad)"/>
    <text x="670" y="35" font-family="'PingFang SC', sans-serif" font-size="19" font-weight="bold" fill="#4ADE80">解决方案：</text>
    <text x="670" y="65" font-family="'PingFang SC', sans-serif" font-size="17" fill="#6EE7B7">ReAct + Workflow + MCP，提升 Tool Calling 成功率</text>
    <text x="670" y="90" font-family="'PingFang SC', sans-serif" font-size="17" fill="#6EE7B7">打通 Data → Train → Distill → Infer → Agent 全链路</text>
  </g>

  <!-- 底部全链路横幅 -->
  <rect x="150" y="900" width="900" height="44" rx="22" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" filter="url(#glow)"/>
  <text x="600" y="928" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" fill="#38BDF8" text-anchor="middle" letter-spacing="2">Data → Train → Distill → Infer → Agent 全链路打通</text>

</svg>